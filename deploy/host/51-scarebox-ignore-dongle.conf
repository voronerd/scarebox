// WirePlumber rule (04-01 Task 3): gbox1 runs Martin's own desktop session alongside the
// scarebox stack, and that desktop's PipeWire/WirePlumber would otherwise grab the USB
// audio dongle the instant it's plugged in -- fighting the `app` container for the same
// hardware (ALSA devices are exclusive: whoever opens the card first wins, and a container
// losing that race is exactly the "silent, no sound" failure 04-01 exists to kill). This
// rule tells WirePlumber to leave that one device alone entirely (`device.disabled`,
// supported since WirePlumber 0.4.7) so only the `app` container's ALSA sink ever opens it.
//
// Installs to `~martin/.config/wireplumber/wireplumber.conf.d/51-scarebox-ignore-dongle.conf`
// -- as martin (the desktop user), NOT as the scarebox service account, and with no root
// needed (it's a per-user config file). See deploy/host/README.md for the exact command.
//
// Device name read off gbox1 with `pw-dump | grep device.name` (2026-10-19): WirePlumber
// names the GeneralPlus dongle (USB 1b3f:2008) by its USB product string, not its IDs. A
// different dongle needs this name changed.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-GeneralPlus_USB_Audio_Device-.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
