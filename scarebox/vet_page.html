<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scarebox -- vet the heckle lines</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0 0 4rem; background: #141217; color: #f0e8ec; }
  header { position: sticky; top: 0; background: #241b26; padding: .75rem 1rem; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  header h1 { margin: 0; font-size: 1.1rem; }
  #counter { font-size: .9rem; opacity: .85; }
  main { padding: .5rem 1rem; }
  h2.cat { margin: 1.2rem 0 .4rem; font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; color: #ffb366; display: flex; justify-content: space-between; align-items: center; }
  .cat-count { font-size: .75rem; opacity: .7; text-transform: none; letter-spacing: 0; }
  button.approve-all { font-size: .75rem; padding: .3rem .6rem; border-radius: 6px; border: 1px solid #5c4b63; background: #322838; color: #f0e8ec; }
  .line { background: #221b26; border-radius: 10px; padding: .6rem .75rem; margin-bottom: .5rem; border: 1px solid #332a38; }
  .line.approved { border-color: #3f7d4a; }
  .line.rejected { border-color: #7d3f3f; opacity: .55; }
  .line-text { font-size: .95rem; margin-bottom: .4rem; }
  .line-meta { font-size: .7rem; opacity: .6; margin-bottom: .4rem; }
  .row { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
  button.decide { font-size: 1.1rem; padding: .3rem .7rem; border-radius: 8px; border: none; min-width: 2.6rem; }
  button.yes { background: #2f6b3a; color: white; }
  button.no { background: #6b2f2f; color: white; }
  button.edit-toggle { background: #332a38; color: #f0e8ec; border: 1px solid #5c4b63; border-radius: 8px; font-size: .85rem; }
  textarea.edit-box { width: 100%; box-sizing: border-box; margin-top: .4rem; background: #141217; color: #f0e8ec; border: 1px solid #5c4b63; border-radius: 6px; padding: .4rem; font-size: .9rem; display: none; }
  .status-pill { font-size: .65rem; padding: .1rem .4rem; border-radius: 10px; background: #332a38; }
  #toast { position: fixed; bottom: 1rem; left: 1rem; right: 1rem; background: #2f6b3a; color: white; padding: .5rem .8rem; border-radius: 8px; text-align: center; display: none; }
</style>
</head>
<body>
<header>
  <h1>Scarebox -- vet the heckle lines</h1>
  <div id="counter">loading...</div>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";

function api(path, opts) {
  const url = path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN);
  return fetch(url, opts).then(r => r.json().then(body => {
    if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
    return body;
  }));
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 1800);
}

function renderCounter(summary) {
  document.getElementById("counter").textContent =
    `${summary.reviewed} / ${summary.total} reviewed`;
}

function lineEl(line) {
  const el = document.createElement("div");
  el.className = "line " + line.status;
  el.dataset.id = line.id;
  el.innerHTML = `
    <div class="line-text">${line.text}</div>
    <div class="line-meta">${line.id} <span class="status-pill">${line.status}</span></div>
    <div class="row">
      <button class="decide yes">&#10003;</button>
      <button class="decide no">&#10007;</button>
      <button class="edit-toggle">edit</button>
    </div>
    <textarea class="edit-box" rows="2">${line.text}</textarea>
  `;
  el.querySelector(".yes").onclick = () => decide(line.id, "approved", el);
  el.querySelector(".no").onclick = () => decide(line.id, "rejected", el);
  const box = el.querySelector(".edit-box");
  el.querySelector(".edit-toggle").onclick = () => {
    box.style.display = box.style.display === "block" ? "none" : "block";
  };
  box.onblur = () => {
    const edited = box.value.trim();
    if (edited && edited !== line.text) {
      decide(line.id, line.status === "pending" ? "approved" : line.status, el, edited);
    }
  };
  return el;
}

function decide(id, status, el, text) {
  const body = { id, status };
  if (text !== undefined) body.text = text;
  api("/api/decide", { method: "POST", body: JSON.stringify(body) })
    .then(resp => {
      el.className = "line " + status;
      el.querySelector(".status-pill").textContent = status;
      renderCounter(resp.summary);
      toast(status === "approved" ? "approved" : "rejected");
    })
    .catch(e => toast("error: " + e.message));
}

function approveCategory(category, btn) {
  api("/api/approve_category", { method: "POST", body: JSON.stringify({ category }) })
    .then(resp => {
      toast(`category "${category}" approved`);
      load();
    })
    .catch(e => toast("error: " + e.message));
}

function load() {
  api("/api/lines").then(data => {
    renderCounter(data.summary);
    const main = document.getElementById("main");
    main.innerHTML = "";
    const byCategory = {};
    for (const line of data.lines) {
      const group = line.pack ? "pack:" + line.pack : line.category;
      (byCategory[group] = byCategory[group] || []).push(line);
    }
    for (const category of Object.keys(byCategory).sort()) {
      const lines = byCategory[category];
      const cs = data.summary.by_category[category] || { total: lines.length, reviewed: 0 };
      const h = document.createElement("h2");
      h.className = "cat";
      h.innerHTML = `<span>${category} <span class="cat-count">${cs.reviewed}/${cs.total}</span></span>`;
      const approveAllBtn = document.createElement("button");
      approveAllBtn.className = "approve-all";
      approveAllBtn.textContent = "approve all remaining";
      approveAllBtn.onclick = () => approveCategory(category, approveAllBtn);
      h.appendChild(approveAllBtn);
      main.appendChild(h);
      for (const line of lines) main.appendChild(lineEl(line));
    }
  }).catch(e => toast("load error: " + e.message));
}

load();
</script>
</body>
</html>
